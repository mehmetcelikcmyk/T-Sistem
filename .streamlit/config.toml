# T-Sistem Streamlit Tema Ayarları
# NOT: src/ui/theme.py açık (light) tema için tasarlandı (beyaz zemin, siyah
# metin, mavi vurgu). Streamlit tabanı da bununla UYUMLU olacak şekilde light
# yapıldı; aksi hâlde koyu zemin üstünde koyu metin okunmuyordu.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#fcfcfb"
textColor = "#0b0b0b"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
runOnSave = true

[runner]
fastReruns = true

[client]
toolbarMode = "minimal"
showSidebarNav = false

[browser]
gatherUsageStats = false
