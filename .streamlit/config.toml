# T-Sistem · Streamlit tema ve sunucu ayarlari

[theme]
base                       = "light"
primaryColor               = "#F04823"   # TEKNOFEST turuncusu
backgroundColor            = "#FFFFFF"
secondaryBackgroundColor   = "#F4F6F9"
textColor                  = "#0F172A"
font                       = "sans serif"

[server]
headless                   = true
maxUploadSize              = 60          # MB — rapor/sablon yuklemeleri
enableStaticServing        = false       # static klasoru olmadigi icin devre disi
enableXsrfProtection       = true
# enableCORS kaldirildi — enableXsrfProtection=true ile catisiyor, Streamlit zaten yonetiyor

[browser]
gatherUsageStats           = false

[client]
showErrorDetails           = false       # prod: teknik detay sizdirma
toolbarMode                = "minimal"

[runner]
fastReruns                 = true
